version: 2

builds:
  - main: ./cmd/metarc
    binary: marc
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

# syft (SBOM) and cosign (signing) must be on PATH, or the release fails with
# "executable file not found". The installer steps live in .github/workflows/release.yml,
# which also needs `id-token: write` for cosign's keyless OIDC flow.
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes
    artifacts: checksum

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^style:"
      - "^chore:"
      - "^ci:"
